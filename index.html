<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sky Ace - Stunt Flight</title>
  <link rel="stylesheet" href="style.css?v=1791265175877">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="gameContainer">
    <!-- Parallax Sky & Mountains -->
    <div class="sky-gradient"></div>
    <div class="sun-flare"></div>
    <div class="clouds-bg"></div>
    <div class="mountains-far"></div>
    <div class="mountains-near"></div>
    <div class="ground-line"></div>

    <!-- Active Entities Layers -->
    <div id="obstacleContainer"></div>
    <div id="collectibleContainer"></div>
    <div id="smoke"></div>
    <div id="sparkleContainer"></div>

    <!-- Player Aircraft -->
    <div id="plane">
      <div class="plane-body">
        <svg viewBox="0 0 80 50" class="plane-svg">
          <defs>
            <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff4b4b" />
              <stop offset="60%" stop-color="#d61f26" />
              <stop offset="100%" stop-color="#8a0004" />
            </linearGradient>
            <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="50%" stop-color="#e2e8f0" />
              <stop offset="100%" stop-color="#94a3b8" />
            </linearGradient>
            <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#67e8f9" />
              <stop offset="70%" stop-color="#0284c7" />
              <stop offset="100%" stop-color="#082f49" />
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>
          <!-- Propeller Spinner -->
          <ellipse cx="76" cy="25" rx="2" ry="18" class="propeller-blade" fill="rgba(255,255,255,0.7)" />
          <ellipse cx="75" cy="25" rx="3" ry="5" fill="#f8fafc" />
          <!-- Fuselage -->
          <path d="M74,25 C70,16 52,14 24,17 C16,18 8,20 2,23 C2,27 10,29 24,31 C52,33 70,30 74,25 Z" fill="url(#fuselageGrad)" />
          <!-- Racing Stripe -->
          <path d="M60,20 L66,20 L58,28 L52,28 Z" fill="#facc15" />
          <path d="M48,20 L54,20 L46,28 L40,28 Z" fill="#ffffff" />
          <!-- Cockpit Canopy Glass -->
          <path d="M48,16 C42,11 32,11 26,16 C34,14 42,14 48,16 Z" fill="url(#canopyGrad)" opacity="0.9" filter="url(#glow)" />
          <!-- Wings -->
          <polygon points="42,24 24,6 12,9 28,26" fill="url(#wingGrad)" />
          <polygon points="42,26 24,44 12,41 28,24" fill="url(#wingGrad)" />
          <!-- Tail Fin -->
          <polygon points="8,19 0,7 6,7 15,20" fill="url(#fuselageGrad)" />
          <polygon points="7,8 2,8 5,14 10,14" fill="#facc15" />
        </svg>
        <div class="engine-glow"></div>
      </div>
    </div>

    <!-- Modern Glassmorphism HUD -->
    <div id="hud">
      <div class="hud-card score-card">
        <span class="hud-label">SCORE</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-card high-card">
        <span class="hud-label">BEST 🏆</span>
        <span id="highScore" class="hud-value">0</span>
      </div>
      <div class="thrust-meter">
        <div id="thrustFill" class="thrust-fill"></div>
      </div>
    </div>

    <!-- Interactive Touch Guidance Hint -->
    <div id="tutorialHint" class="tutorial-hint">
      <div class="tap-icon">👆</div>
      <p>TAP & HOLD TO CLIMB<br><span>RELEASE TO GLIDE</span></p>
    </div>

    <!-- Game Over Modal Overlay -->
    <div id="gameOverBanner" class="modal-backdrop">
      <div class="modal-card">
        <div class="badge-crash">💥 FLIGHT CRASHED</div>
        <h1 class="modal-title">MISSION OVER</h1>
        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-lbl">DISTANCE SCORE</span>
            <span id="finalScore" class="stat-num">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-lbl">ALL-TIME BEST</span>
            <span id="highScoreDisplay" class="stat-num">0</span>
          </div>
        </div>
        <button id="restartBtn" class="restart-action-btn">
          <span>✈️ FLY AGAIN</span>
        </button>
      </div>
    </div>
  </div>

  <script src="game.js?v=1791265175877"></script>
</body>
</html>
