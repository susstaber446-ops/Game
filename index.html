<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Finger Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <div id="plane">
            <!-- SVG plane with pilot -->
            <svg width="60" height="40" viewBox="0 0 60 40">
                <!-- Fuselage -->
                <rect x="5" y="15" width="40" height="10" fill="#ffcc00"/>
                <!-- Wing -->
                <polygon points="0,20 5,25 45,25 50,20" fill="#ffcc00"/>
                <!-- Tail -->
                <polygon points="45,15 50,10 55,15 50,20" fill="#ffcc00"/>
                <!-- Pilot -->
                <circle cx="20" cy="12" r="4" fill="#fff"/>
            </svg>
        </div>
        <div id="smoke"></div>
    </div>
    <div id="ui">
        <div id="score">Score: 0</div>
        <button id="restartBtn" style="display:none;">Restart</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
